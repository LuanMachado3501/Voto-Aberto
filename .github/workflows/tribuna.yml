name: Publicar Tribuna

on:
  workflow_dispatch:   # rode em Actions > Publicar Tribuna > Run workflow sempre que o servidor mudar

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Conferir os segredos
        env:
          D1: ${{ secrets.D1_DATABASE_ID }}
          TS: ${{ secrets.TURNSTILE_SECRET }}
          AD: ${{ secrets.TRIBUNA_ADMIN_SENHA }}
        run: |
          falta=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1" ] || falta="$falta D1_DATABASE_ID"
          [ -n "$TS" ] || falta="$falta TURNSTILE_SECRET"
          [ -n "$AD" ] || falta="$falta TRIBUNA_ADMIN_SENHA"
          if [ -n "$falta" ]; then echo "::error::Faltam estes segredos no GitHub (Settings > Secrets > Actions):$falta"; exit 1; fi

      - name: Preparar (lista de reeleitos e configuração)
        env:
          D1: ${{ secrets.D1_DATABASE_ID }}
        run: |
          python3 scripts/build_reeleitos.py > tribuna/reeleitos.json
          cat > tribuna/wrangler.toml <<TOML
          name = "tribuna"
          main = "worker.js"
          compatibility_date = "2025-09-01"
          workers_dev = true
          [triggers]
          crons = ["0 7 * * *"]
          [[d1_databases]]
          binding = "DB"
          database_name = "tribuna"
          database_id = "$D1"
          TOML

      - name: Criar as tabelas (não apaga nada que já existe)
        working-directory: tribuna
        run: npx --yes wrangler@4.40.0 d1 execute tribuna --remote --file schema.sql

      - name: Publicar o servidor
        working-directory: tribuna
        run: npx --yes wrangler@4.40.0 deploy | tee deploy.log

      - name: Guardar as senhas no servidor
        working-directory: tribuna
        env:
          TS: ${{ secrets.TURNSTILE_SECRET }}
          AD: ${{ secrets.TRIBUNA_ADMIN_SENHA }}
        run: |
          printf '%s' "$TS" | npx --yes wrangler@4.40.0 secret put TURNSTILE_SECRET
          printf '%s' "$AD" | npx --yes wrangler@4.40.0 secret put ADMIN_SENHA

      - name: Endereço da Tribuna
        working-directory: tribuna
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))")
            [ -n "$SUB" ] && URL="https://tribuna.$SUB.workers.dev"
          fi
          echo "## Tribuna publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Servidor: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Moderação: $URL/admin" >> "$GITHUB_STEP_SUMMARY"
          echo "Servidor: $URL"

name: Atualizar dados

on:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda, 6h em Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pandas==2.2.3

      - name: Baixar dados e recalcular
        run: bash scripts/atualizar.sh

      - name: Publicar se algo mudou
        run: |
          git config user.name "Centro Político (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última atualização."
          else
            git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi

      - name: Avisar se alguma parte falhou
        run: |
          if [ -s raw/falhas.txt ]; then
            echo "::warning::Partes que não atualizaram nesta rodada: $(tr '\n' ' ' < raw/falhas.txt)"
            exit 1
          fi

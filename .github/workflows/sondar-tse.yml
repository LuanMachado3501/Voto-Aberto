name: Sondar TSE
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Testar nomes de arquivo
        run: |
          mkdir -p raw_tse && cd raw_tse
          B=https://resultados.tse.jus.br/oficial/ele2026
          : > teste.txt
          for p in \
            "6257/dados-simplificados/br/br-c0001-e006257-r.json" \
            "6257/dados/br/br-c0001-e006257-u.json" "6257/dados/br/br-c0001-e006257-v.json" "6257/dados/br/br-c0001-e006257-e.json" \
            "6257/dados/br/br-c0001-e006257-ab.json" "6257/dados/sp/sp-c0001-e006257-u.json" "6257/dados/sp/sp-c0001-e006257-v.json" \
            "6257/dados/sp/sp71072-c0001-e006257-u.json" "6257/dados/sp/sp71072-c0001-e006257-v.json" \
            "6257/config/br-e006257-c.json" "6257/config/mun-e006257-cm.json" "6257/config/br/br-e006257-c.json" \
            "6258/dados/br/br-c0001-e006258-u.json" "6258/dados/br/br-c0001-e006258-v.json" "6258/dados-simplificados/br/br-c0001-e006258-r.json" "6258/config/mun-e006258-cm.json" \
            "6260/dados/df/df-c0003-e006260-u.json" "6260/dados/df/df-c0003-e006260-v.json" \
            "6259/dados/df/df-c0003-e006259-u.json" "6259/dados/df/df-c0003-e006259-v.json" "6259/dados-simplificados/df/df-c0003-e006259-r.json" ; do
            f=$(echo $p | tr '/' '_'); code=$(curl -s -o "$f" -w "%{http_code} %{size_download}" -H "Origin: https://centropolitico.com.br" "$B/$p"); echo "$code $p" | tee -a teste.txt
            if [ "${code%% *}" != "200" ]; then rm -f "$f"; fi
          done
      - run: |
          git config user.name "Centro Político (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_tse && git commit -qm "Sonda do TSE 2" && git pull --rebase -q && git push -q || true

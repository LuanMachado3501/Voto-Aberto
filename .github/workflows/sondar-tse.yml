name: Sondar TSE
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Baixar todos os estados
        run: |
          mkdir -p raw_tse/m && cd raw_tse/m
          B=https://resultados.tse.jus.br/oficial/ele2026
          for e in 6257 6258; do for u in br ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to; do
            curl -s -f -o "$e-$u-c0001.json" "$B/$e/dados/$u/$u-c0001-e00$e-u.json" || echo "falhou $e $u"; done; done
          for e in 6259 6260; do for u in am rn df; do curl -s -f -o "$e-$u-c0003.json" "$B/$e/dados/$u/$u-c0003-e00$e-u.json" || echo "falhou $e $u"; done; done
          curl -s -o foto.jpeg -w "foto %{http_code} %{content_type}\n" "$B/6258/fotos/br/280002542548.jpeg"
          ls | wc -l
      - run: |
          git config user.name "Centro Político (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_tse && git commit -qm "Sonda do TSE 2" && git pull --rebase -q && git push -q || true

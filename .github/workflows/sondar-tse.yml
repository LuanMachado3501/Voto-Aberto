name: Sondar TSE
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-24.04
    steps:
      - name: Conferir arquivos do 2º turno
        run: |
          B=https://resultados.tse.jus.br/oficial
          O="Origin: https://centropolitico.com.br"
          echo "== config"; curl -s -H "$O" "$B/comum/config/ele-c.json" | python3 -c "
          import json,sys; c=json.load(sys.stdin); print('gerado',c['dg'],c['hg'])
          for p in c['pl']:
            for e in p['e']:
              if e['cd'] in ('6258','6260') or 'Ordinária' in e['nm']: print(p['c'],p['dt'],e['cd'],e['nm'],[a['cd'] for a in e['abr']])"
          for u in "ele2026/6258/dados/br/br-c0001-e006258-u.json" "ele2026/6258/dados/sp/sp-c0001-e006258-u.json" "ele2026/6258/dados/ba/ba-c0001-e006258-u.json" \
                   "ele2026/6260/dados/am/am-c0003-e006260-u.json" "ele2026/6260/dados/rn/rn-c0003-e006260-u.json" "ele2026/6260/dados/df/df-c0003-e006260-u.json" "ele2026/6258/fotos/br/280002542548.jpeg"; do
            r=$(curl -s -D - -o /tmp/f -H "$O" "$B/$u"); code=$(echo "$r" | head -1 | awk '{print $2}'); cors=$(echo "$r" | grep -i "^access-control-allow-origin" | tr -d '\r')
            echo "$code | $cors | $u | $(head -c 160 /tmp/f | tr -d '\n')"
          done
